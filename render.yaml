# Render Blueprint for Heimdall.
#
# Two services:
#   1. heimdall-backend (Python / FastAPI) — the governance layer + dashboard API
#   2. heimdall-lobstertrap (Docker / Go) — the real Veea DPI proxy
#
# Click "New +" → "Blueprint" in the Render dashboard, connect this repo,
# and Render reads this file. You'll need to set GEMINI_API_KEY on both
# services after the first sync — Lobster Trap forwards to Google's
# OpenAI-compatible Gemini endpoint, so it also needs the key.
#
# Plan: both free Web Services. 512 MB RAM, 0.1 vCPU, spin down after
# 15 min idle, ~30-60s cold start. $0/month total.

services:
  # ── 1. Heimdall backend ──────────────────────────────────────────
  - type: web
    name: heimdall-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: HEIMDALL_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false                # set manually in the Render dashboard
      - key: HEIMDALL_ALLOWED_ORIGINS
        sync: false                # set to your Vercel URL after first deploy
      # Lobster Trap URL: set this to the public URL of the second service
      # below once it deploys (e.g. https://heimdall-lobstertrap.onrender.com).
      # When unset, the backend falls back to its built-in simulation.
      - key: LOBSTER_TRAP_URL
        sync: false
      # Sepolia env vars deliberately unset → executor stays in mock mode.

  # ── 2. Lobster Trap reverse proxy ────────────────────────────────
  - type: web
    name: heimdall-lobstertrap
    runtime: docker
    plan: free
    region: oregon
    branch: main
    rootDir: lobstertrap_service
    dockerfilePath: Dockerfile
    healthCheckPath: /
    envVars:
      # Google's OpenAI-compatible Gemini endpoint. Lobster Trap forwards
      # every /v1/chat/completions call here, with the Authorization header
      # from the agent (Heimdall) passed through unchanged.
      - key: LT_BACKEND
        value: "https://generativelanguage.googleapis.com/v1beta/openai"
