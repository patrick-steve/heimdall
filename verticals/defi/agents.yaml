    tenant_id: tenant-acme-corp
    scope:
      - "read:portfolio"
      - "write:portfolio"
      - "execute:trade"
      - "read:market_data"
    owner: "alice@acme.example"
    registered_days_ago: 30

  - id: agent-marketdata-001
    role: data_fetcher
    display_name: "Market Data Agent"
    tenant_id: tenant-acme-corp
    scope:
      - "read:market_data"
