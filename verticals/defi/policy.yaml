# DeFi vertical policy pack.
# All six rule primitives represented so the rule sidebar fires variety
# during the demo. The shadow_to_executor_pattern rule is what would catch
# the attack at Layer 2 even if Layer 1 ever missed it.
policies:
  - name: chain_depth_limit
    type: chain_depth
    config:
      max_depth: 4
    on_violation: DENY

  - name: dormant_agent_block
    type: agent_state
    config:
      condition: "is_dormant == true"
    on_violation: DENY

  - name: value_threshold_by_depth
    type: value_threshold
    config:
      thresholds:
        - depth: 2
          max_value: 100000
        - depth: 3
          max_value: 10000
        - depth: 4
          max_value: 1000
    on_violation: DENY

  - name: shadow_to_executor_pattern
    type: chain_pattern
    config:
      match_by: role
      pattern: ".*->shadow->.*executor"
    on_violation: DENY

  - name: declared_intent_check
    type: intent_mismatch
    config:
      threshold_similarity: 0.3
      on_violation: FLAG
    on_violation: FLAG

  - name: behavioral_drift_check
    type: behavioral_drift
    config:
      min_history: 50
      novel_delegation_action: FLAG
    on_violation: FLAG
