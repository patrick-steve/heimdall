# Healthcare vertical policy pack.
# Same six rule primitives, tuned for clinical workflows.
policies:
  - name: chain_depth_limit
    type: chain_depth
    config:
      max_depth: 4
    on_violation: DENY

  - name: dormant_vendor_block
    type: agent_state
    config:
      condition: "is_dormant == true"
    on_violation: DENY

  - name: phi_volume_by_depth
    type: value_threshold
    config:
      thresholds:
        - depth: 2
          max_value: 1000   # records per call
        - depth: 3
          max_value: 100
        - depth: 4
          max_value: 10
    on_violation: DENY

  - name: vendor_to_update_pattern
    type: chain_pattern
    config:
      match_by: role
      pattern: ".*->shadow->.*executor"
    on_violation: DENY

  - name: declared_intent_check
    type: intent_mismatch
    config:
      threshold_similarity: 0.3
    on_violation: FLAG

  - name: behavioral_drift_check
    type: behavioral_drift
    config:
      min_history: 50
      novel_delegation_action: FLAG
    on_violation: FLAG
