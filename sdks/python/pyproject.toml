[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall-sdk"
version = "0.1.0"
description = "Python SDK for Heimdall — runtime governance for AI agent delegation chains."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Heimdall", email = "hello@heimdall.dev" }
]
keywords = ["ai", "agents", "governance", "authorization", "delegation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.24",
]

[project.urls]
Homepage = "https://github.com/patrick-steve/heimdall"
Documentation = "https://github.com/patrick-steve/heimdall/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/patrick-steve/heimdall/issues"

[tool.setuptools.packages.find]
include = ["heimdall*"]
exclude = ["examples*"]
