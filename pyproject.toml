[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall"
version = "0.1.0"
description = "Heimdall — runtime governance for AI agent delegation chains."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Heimdall", email = "hello@heimdall.dev" }
]
keywords = ["ai", "agents", "governance", "authorization", "delegation", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# The runtime deps are installed from backend/requirements.txt during image
# build; this list duplicates them so `pip install -e .` works on a fresh
# checkout without remembering the second requirements file.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pyjwt>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
defi = ["web3>=7.4"]
gemini = ["google-generativeai>=0.8"]
report = ["reportlab>=4.2"]

[project.urls]
Homepage = "https://github.com/patrick-steve/heimdall"
Documentation = "https://github.com/patrick-steve/heimdall/blob/main/docs/QUICKSTART.md"
Issues = "https://github.com/patrick-steve/heimdall/issues"

[project.scripts]
heimdall = "cli.heimdall_cli:main"

[tool.setuptools.packages.find]
include = ["backend*", "cli*", "scripts*"]
exclude = ["sdks*", "frontend*", "verticals*", "policies*", "audit_logs*", "lobstertrap_service*"]
