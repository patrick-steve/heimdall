# Same idea as cross_tenant_isolation: this is Layer 1 territory
# (capability attenuation enforced at sign time). YAML mirror for
# auditors and external policy readers who want to see scope shrinkage
# as a documented requirement.
policies:
  - name: credential_scope_attenuation
    type: chain_pattern
    config:
      pattern: "(scope_widen|elevated_callee)"  # illustrative tag
    on_violation: DENY
